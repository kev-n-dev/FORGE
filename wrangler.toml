# FORGE — Cloudflare Workers configuration
# https://developers.cloudflare.com/workers/wrangler/configuration/
#
# Secrets (AUTH_SECRET, TURNSTILE_SECRET, etc.) are NEVER stored here.
# Set them via: wrangler secret put <NAME>

name = "forge-worker"
main = "apps/worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# D1 Databases
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "forge-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# KV Namespaces
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "SESSION_KV"
id = "REPLACE_WITH_SESSION_KV_ID"
preview_id = "REPLACE_WITH_SESSION_KV_PREVIEW_ID"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_CACHE_KV_ID"
preview_id = "REPLACE_WITH_CACHE_KV_PREVIEW_ID"

# ---------------------------------------------------------------------------
# R2 Buckets
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "forge-media"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "forge-private"

# ---------------------------------------------------------------------------
# Queues
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "forge-notifications"

[[queues.producers]]
binding = "MODERATION_QUEUE"
queue = "forge-moderation"

[[queues.consumers]]
queue = "forge-notifications"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "forge-notifications-dlq"

[[queues.consumers]]
queue = "forge-moderation"
max_batch_size = 5
max_batch_timeout = 10
max_retries = 3

# ---------------------------------------------------------------------------
# Cron Triggers
# ---------------------------------------------------------------------------
[triggers]
crons = [
  # Cleanup expired tokens daily at 3am UTC
  "0 3 * * *",
  # Reputation recalculation weekly on Sunday at 2am UTC
  "0 2 * * 0",
]

# ---------------------------------------------------------------------------
# Environment variables (non-secret — safe to commit)
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "development"
MEDIA_BASE_URL = "https://media.forge.example.com"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

# ---------------------------------------------------------------------------
# Development environment overrides
# ---------------------------------------------------------------------------
[env.development]
name = "forge-worker-dev"
vars = { ENVIRONMENT = "development", MEDIA_BASE_URL = "http://localhost:8787/dev-media" }

[[env.development.d1_databases]]
binding = "DB"
database_name = "forge-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.development.kv_namespaces]]
binding = "SESSION_KV"
id = "REPLACE_WITH_SESSION_KV_ID"
preview_id = "REPLACE_WITH_SESSION_KV_PREVIEW_ID"

[[env.development.kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_CACHE_KV_ID"
preview_id = "REPLACE_WITH_CACHE_KV_PREVIEW_ID"

[[env.development.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "forge-media-dev"

[[env.development.r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "forge-private-dev"

# ---------------------------------------------------------------------------
# Staging environment
# ---------------------------------------------------------------------------
[env.staging]
name = "forge-worker-staging"
vars = { ENVIRONMENT = "staging", MEDIA_BASE_URL = "https://media.staging.forge.example.com" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "forge-db-staging"
database_id = "REPLACE_WITH_STAGING_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.staging.kv_namespaces]]
binding = "SESSION_KV"
id = "REPLACE_WITH_STAGING_SESSION_KV_ID"
preview_id = "REPLACE_WITH_STAGING_SESSION_KV_PREVIEW_ID"

[[env.staging.kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_STAGING_CACHE_KV_ID"
preview_id = "REPLACE_WITH_STAGING_CACHE_KV_PREVIEW_ID"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "forge-media-staging"

[[env.staging.r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "forge-private-staging"

# ---------------------------------------------------------------------------
# Production environment
# ---------------------------------------------------------------------------
[env.production]
name = "forge-worker"
vars = { ENVIRONMENT = "production", MEDIA_BASE_URL = "https://media.forge.example.com" }
routes = [{ pattern = "forge.example.com/api/*", zone_name = "forge.example.com" }]

[[env.production.d1_databases]]
binding = "DB"
database_name = "forge-db"
database_id = "REPLACE_WITH_PRODUCTION_D1_DATABASE_ID"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "SESSION_KV"
id = "REPLACE_WITH_PRODUCTION_SESSION_KV_ID"
preview_id = "REPLACE_WITH_PRODUCTION_SESSION_KV_PREVIEW_ID"

[[env.production.kv_namespaces]]
binding = "CACHE_KV"
id = "REPLACE_WITH_PRODUCTION_CACHE_KV_ID"
preview_id = "REPLACE_WITH_PRODUCTION_CACHE_KV_PREVIEW_ID"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "forge-media"

[[env.production.r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "forge-private"

[[env.production.queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "forge-notifications"

[[env.production.queues.producers]]
binding = "MODERATION_QUEUE"
queue = "forge-moderation"
