# The Guild — Cloudflare Workers configuration

name = "the-guild"
main = "apps/worker/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------------
# Static Assets — serves the React frontend
# ---------------------------------------------------------------------------
[assets]
directory = "apps/web/dist"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# D1 Database
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "forge-db"
database_id = "006bac57-03c4-4a34-9c66-753f9b95bfb4"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# KV Namespaces
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "SESSION_KV"
id = "2ff85947790948a095b703cd0bf67295"
preview_id = "2ff85947790948a095b703cd0bf67295"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "bddb665f88f84b0bb04b4154e501ab98"
preview_id = "bddb665f88f84b0bb04b4154e501ab98"

# ---------------------------------------------------------------------------
# R2 Buckets
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "forge-media"

[[r2_buckets]]
binding = "PRIVATE_BUCKET"
bucket_name = "forge-private"

# ---------------------------------------------------------------------------
# Queues — uncomment when Phase 2 is ready
# ---------------------------------------------------------------------------
# [[queues.producers]]
# binding = "NOTIFICATION_QUEUE"
# queue = "the-guild-notifications"
#
# [[queues.producers]]
# binding = "MODERATION_QUEUE"
# queue = "the-guild-moderation"

# ---------------------------------------------------------------------------
# Cron Triggers — uncomment when background jobs are implemented
# ---------------------------------------------------------------------------
# [triggers]
# crons = [
#   "0 3 * * *",
#   "0 2 * * 0",
# ]

# ---------------------------------------------------------------------------
# Environment variables (non-secret)
# Secrets are set via Cloudflare dashboard → Workers → the-guild → Settings → Variables & Secrets
# ---------------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
MEDIA_BASE_URL = "https://the-guild.kc-labs.workers.dev"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"
